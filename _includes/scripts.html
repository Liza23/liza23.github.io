<script src="{{ base_path }}/assets/js/main.min.js"></script>

{% include analytics.html %}

<script type="module">
import createGlobe from 'https://esm.sh/cobe@0.6.3';
var canvas = document.getElementById('cobe-globe');
if (canvas) {
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var size = 160;
  canvas.width = size * dpr;
  canvas.height = size * dpr;
  canvas.style.width = size + 'px';
  canvas.style.height = size + 'px';
  var phi = 0;
  createGlobe(canvas, {
    devicePixelRatio: dpr,
    width: size * dpr,
    height: size * dpr,
    phi: 0,
    theta: 0.2,
    dark: 0,
    diffuse: 0.6,
    mapSamples: 16000,
    mapBrightness: 20,
    baseColor: [0.97, 0.97, 0.96],
    markerColor: [0.07, 0.07, 0.06],
    glowColor: [0.9, 0.9, 0.88],
    markers: [],
    onRender: function(state) { state.phi = phi; phi += 0.004; }
  });
}
</script>
